<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verbalized vs. Simulated Distributions</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a2e;
    --accent: #4361ee;
    --accent-light: #e8ecff;
    --border: #e0e0e0;
    --row-hover: #f5f7ff;
    --best-fg: #1a7a1a;
    --missing: #999;
    --befm-bg: #f0f4ff;
    --header-bg: #f8f9fa;
    --tab-inactive: #6b7280;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.5;
    padding: 2rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
  h2 { font-size: 1.1rem; margin: 1.6rem 0 0.5rem; }
  .subtitle { color: #6b7280; margin-bottom: 0.6rem; font-size: 0.95rem; }
  .nav-internal { font-size: 0.85rem; margin-bottom: 1.2rem; }
  .nav-internal a { color: var(--accent); text-decoration: none; }
  .nav-internal a:hover { text-decoration: underline; }
  .intro { max-width: 60rem; font-size: 0.92rem; margin-bottom: 1.2rem; }
  .intro p { margin-bottom: 0.6rem; }
  .intro strong { color: var(--fg); }

  .info-bar {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1rem;
    font-size: 0.82rem;
    color: #6b7280;
    flex-wrap: wrap;
    align-items: center;
  }
  .info-bar a { color: var(--accent); }

  .detail-toggle {
    display: inline-block;
    padding: 0.25rem 0.7rem;
    font-size: 0.78rem;
    font-weight: 500;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #f9fafb;
    cursor: pointer;
    color: var(--tab-inactive);
    transition: all 0.15s;
  }
  .detail-toggle:hover { background: #eef0f4; color: var(--fg); }
  .detail-toggle.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .table-wrap { overflow-x: auto; }
  table.compact { width: auto; min-width: 46rem; }
  table.compact th, table.compact td { padding-left: 1.4rem; padding-right: 1.4rem; }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 0.85rem;
  }
  th, td {
    padding: 0.55rem 0.75rem;
    text-align: right;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }
  td { background: var(--bg); position: relative; z-index: 0; }
  th {
    background: var(--header-bg);
    font-weight: 600;
    position: sticky;
    top: 0;
    z-index: 3;
    cursor: pointer;
    user-select: none;
  }
  th.grp { cursor: default; text-align: center; font-size: 0.8rem; border-bottom: none; border-left: 1px solid var(--border); }
  thead tr:nth-child(2) th { top: 2.1rem; }
  th:hover { background: #eef0f4; }
  th.grp:hover { background: var(--header-bg); }
  th .sort-arrow { font-size: 0.7rem; margin-left: 0.2rem; opacity: 0.4; }
  th.sorted .sort-arrow { opacity: 1; }
  .th-sub { display: block; font-size: 0.7rem; font-weight: 400; color: #888; }

  .sc-model { position: sticky; left: 0; z-index: 2; background: var(--bg); text-align: left; min-width: 13rem; max-width: 13rem; white-space: normal; line-height: 1.3; }
  th.sc-model { z-index: 5; background: var(--header-bg); }
  th.sc-model:hover { background: #eef0f4; }
  .col-side-end { border-right: 2px solid var(--border); }
  .col-side { background: #eef2ff !important; }
  th.col-side { background: #e0e6f8 !important; }
  th.col-side:hover { background: #d4dcf0 !important; }

  tr:hover td { background: var(--row-hover); }
  tr:hover .col-side { background: #e0e8ff !important; }
  tr.befm td { background: var(--befm-bg); }
  tr.befm .col-side { background: #dde4ff !important; }
  tr.befm:hover td { background: #e0e8ff; }
  tr.befm:hover .col-side { background: #d0dcff !important; }
  tfoot td { color: #6b7280; font-style: italic; background: #fafafa; }
  tfoot td.sc-model { font-style: normal; }

  .model-name { font-weight: 500; }
  .family-tag {
    display: inline-block;
    font-size: 0.65rem;
    padding: 0.1rem 0.35rem;
    border-radius: 3px;
    margin-left: 0.4rem;
    font-weight: 600;
    vertical-align: middle;
  }
  .family-tag.befm { background: #dbeafe; color: #1e40af; }

  .cell-best { font-weight: 700; color: var(--best-fg); }
  .cell-missing { color: var(--missing); font-style: italic; }
  .cell-flagged { cursor: help; }
  .cell-flagged sup { color: #b45309; font-size: 0.7em; margin-left: 1px; }

  .win-bar {
    display: inline-block;
    height: 10px;
    border-radius: 2px;
    margin-right: 0.4rem;
    vertical-align: middle;
    min-width: 2px;
  }

  code {
    background: var(--header-bg);
    padding: 0.1rem 0.35rem;
    border-radius: 3px;
    font-size: 0.85em;
  }

  @media (max-width: 768px) {
    body { padding: 1rem; }
    h1 { font-size: 1.4rem; }
    .sc-model { min-width: 9rem; max-width: 9rem; }
  }
</style>
</head>
<body>

<h1>Verbalized vs. Simulated Distributions</h1>
<p class="subtitle">The distributional tasks of BehaviorBench scored two ways, for every model that has been run both ways.</p>
<p class="nav-internal"><a href="index.html">&larr; Back to Leaderboard</a> &nbsp;&middot;&nbsp; <a href="methodology.html">Ranking methodology</a></p>

<div class="intro" id="intro"></div>

<div class="info-bar" id="info-bar"></div>

<div id="content"></div>

<script src="data.js?v=4"></script>
<script src="data_verbalized.js?v=1"></script>
<script src="verbalized.js?v=2"></script>
<script>
"use strict";

const TABLE = vdBuild(LEADERBOARD_DATA, VERBALIZED_DATA);
const SUMMARY = vdSummary(VERBALIZED_DATA, TABLE);
let showDetails = false;

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function fmtWR(v) {
  if (v == null) return '<span class="cell-missing">&ndash;</span>';
  return v.toFixed(3);
}

function fmtW(v) {
  if (v == null) return '<span class="cell-missing">&ndash;</span>';
  return v.toFixed(2);
}

function wrBar(v) {
  if (v == null) return "";
  const w = Math.round(v * 60);
  const r = Math.round(220 - v * 180);
  const g = Math.round(80 + v * 140);
  return `<span class="win-bar" style="width:${w}px;background:rgb(${r},${g},80);"></span>`;
}

function familyTag(row) {
  return row.family === "befm" ? '<span class="family-tag befm">Be.FM</span>' : "";
}

function pct(v) {
  return v === 1 ? "100%" : (v * 100).toFixed(1) + "%";
}

function renderIntro() {
  const s = SUMMARY;
  document.getElementById("intro").innerHTML = `
    <p><strong>Simulated distributions</strong> are what the main leaderboard's Distributional tab scores: the model answers
    once per individual, the answers are pooled, and the pooled distribution is compared with the human one.
    <strong>Verbalized distributions</strong> skip the sampling: the model is asked one question per condition
    (one game, one survey item, one personality dimension) and writes out the whole population distribution as text.
    Each question is asked ${s.repeats} times and the distances are averaged.</p>
    <p>Both settings use the same metric, the Wasserstein-1 distance (W Distance) between the model's distribution and the
    human distribution, on the same scale: games rescaled to 0 to 100, surveys, personality and age on their native scales.
    Lower is better. This page holds the ${s.nModels} models with a run in both settings, over ${s.nTasks} tasks
    and ${s.conditions} conditions.</p>`;
}

function renderInfoBar() {
  const s = SUMMARY;
  document.getElementById("info-bar").innerHTML = `
    <span><strong>${s.nModels}</strong>&nbsp;models &middot; <strong>${s.nTasks}</strong>&nbsp;tasks</span>
    <span>Ranking: Mean Win Rate (HELM-style), each setting over the models on this page. <a href="methodology.html">Methodology &rarr;</a></span>
    <span>Best per column in <strong style="color:var(--best-fg)">green bold</strong>. Click a header to sort.</span>
    <button type="button" class="detail-toggle${showDetails ? " active" : ""}" id="detail-toggle">${showDetails ? "Hide task details" : "Show task details"}</button>`;
}

function renderTable() {
  const { tasks, rows, best } = TABLE;
  let html = `<div class="table-wrap"><table id="vd-table" class="${showDetails ? "" : "compact"}"><thead><tr>
    <th class="sc-model" rowspan="2" data-col="model" data-type="str">Model<span class="sort-arrow"></span></th>
    <th class="grp col-side" colspan="2">Verbalized distributions</th>
    <th class="grp col-side col-side-end" colspan="2">Simulated distributions</th>`;
  if (showDetails) {
    tasks.forEach(t => {
      html += `<th class="grp" colspan="2">${esc(t.name)}<span class="th-sub">${t.conditions} condition${t.conditions === 1 ? "" : "s"}</span></th>`;
    });
  }
  html += `</tr><tr>
    <th class="col-side sorted" data-col="verbRank" data-type="num" data-direction="lower" data-sort-dir="asc">Rank<span class="sort-arrow">&#9650;</span></th>
    <th class="col-side" data-col="verbWR" data-type="num" data-direction="higher">Mean win rate<span class="th-sub">&uarr;</span><span class="sort-arrow"></span></th>
    <th class="col-side" data-col="simRank" data-type="num" data-direction="lower">Rank<span class="sort-arrow"></span></th>
    <th class="col-side col-side-end" data-col="simWR" data-type="num" data-direction="higher">Mean win rate<span class="th-sub">&uarr;</span><span class="sort-arrow"></span></th>`;
  if (showDetails) {
    tasks.forEach(t => {
      html += `<th data-col="verb_${t.id}" data-type="num" data-direction="lower">Verb.<span class="th-sub">W &darr;</span><span class="sort-arrow"></span></th>`;
      html += `<th data-col="sim_${t.id}" data-type="num" data-direction="lower">Sim.<span class="th-sub">W &darr;</span><span class="sort-arrow"></span></th>`;
    });
  }
  html += `</tr></thead><tbody>`;

  rows.forEach(r => {
    html += `<tr class="${r.family === "befm" ? "befm" : ""}">
      <td class="sc-model" data-sort-val="${esc(r.name)}"><span class="model-name">${esc(r.name)}</span>${familyTag(r)}</td>
      <td class="col-side" data-sort-val="${r.verbRank ?? ""}">${r.verbRank ?? '<span class="cell-missing">&ndash;</span>'}</td>
      <td class="col-side" data-sort-val="${r.verbWR ?? ""}">${wrBar(r.verbWR)}${fmtWR(r.verbWR)}</td>
      <td class="col-side" data-sort-val="${r.simRank ?? ""}">${r.simRank ?? '<span class="cell-missing">&ndash;</span>'}</td>
      <td class="col-side col-side-end" data-sort-val="${r.simWR ?? ""}">${wrBar(r.simWR)}${fmtWR(r.simWR)}</td>`;
    if (showDetails) {
      tasks.forEach(t => {
        const v = r.verb[t.id];
        const sv = r.sim[t.id];
        const flag = r.flags[t.id];
        let cls = "";
        if (v != null && best.verb[t.id] != null && vdRound2(v) === best.verb[t.id]) cls += " cell-best";
        let sup = "";
        let title = "";
        if (flag != null) {
          cls += " cell-flagged";
          sup = "<sup>&dagger;</sup>";
          title = ` title="${pct(flag)} of the ${t.conditions * VERBALIZED_DATA.repeats} verbalized answers on this task could not be read as a distribution and were scored as the uniform distribution"`;
        }
        html += `<td class="${cls.trim()}" data-sort-val="${v ?? ""}"${title}>${fmtW(v)}${sup}</td>`;
        let scls = "";
        if (sv != null && best.sim[t.id] != null && vdRound2(sv) === best.sim[t.id]) scls = "cell-best";
        html += `<td class="${scls}" data-sort-val="${sv ?? ""}">${fmtW(sv)}</td>`;
      });
    }
    html += `</tr>`;
  });
  html += `</tbody>`;

  if (showDetails) {
    const ref = VERBALIZED_DATA.reference;
    const refRow = (label, values) => {
      let h = `<tr><td class="sc-model">${label}</td><td colspan="4" class="col-side col-side-end" style="text-align:left">reference for the verbalized cells, not ranked</td>`;
      tasks.forEach(t => {
        h += `<td>${fmtW(values[t.id])}</td><td class="cell-missing">&ndash;</td>`;
      });
      return h + `</tr>`;
    };
    html += `<tfoot>${refRow("Uniform distribution", ref.uniform)}${refRow("Binning floor", ref.binFloor)}</tfoot>`;
  }
  html += `</table></div>`;
  document.getElementById("content").innerHTML = html;
}

// Column sorting, as on the main page: first click sorts best-first, later
// clicks flip. Rows carry data-sort-val so bars and flags do not get in the way.
function setupSorting() {
  document.querySelectorAll("table thead th[data-col]").forEach(th => {
    th.addEventListener("click", () => {
      const table = th.closest("table");
      const tbody = table.querySelector("tbody");
      const rows = Array.from(tbody.querySelectorAll("tr"));
      const colKey = th.dataset.col;
      const isNum = th.dataset.type === "num";
      const headerRows = Array.from(table.querySelectorAll("thead tr"));
      const occupied = {};
      const colKeyToIdx = {};
      headerRows.forEach((tr, rowIdx) => {
        let virtCol = 0;
        Array.from(tr.children).forEach(cell => {
          while (occupied[`${rowIdx}_${virtCol}`]) virtCol++;
          const rs = parseInt(cell.getAttribute("rowspan") || "1");
          const cs = parseInt(cell.getAttribute("colspan") || "1");
          if (cell.dataset.col) colKeyToIdx[cell.dataset.col] = virtCol;
          for (let r = 0; r < rs; r++)
            for (let c = 0; c < cs; c++)
              occupied[`${rowIdx + r}_${virtCol + c}`] = true;
          virtCol += cs;
        });
      });
      const colIdx = colKeyToIdx[colKey] ?? -1;
      const direction = th.dataset.direction;
      const cur = th.dataset.sortDir;
      let asc;
      if (cur === "asc" || cur === "desc") asc = cur !== "asc";
      else asc = !isNum || direction === "lower";

      table.querySelectorAll("th").forEach(h => {
        h.classList.remove("sorted");
        if (h !== th) delete h.dataset.sortDir;
        const arrow = h.querySelector(".sort-arrow");
        if (arrow) arrow.textContent = "";
      });
      th.dataset.sortDir = asc ? "asc" : "desc";
      th.classList.add("sorted");
      const arrow = th.querySelector(".sort-arrow");
      if (arrow) arrow.textContent = asc ? "▲" : "▼";

      rows.sort((a, b) => {
        let va = a.children[colIdx]?.dataset.sortVal ?? a.children[colIdx]?.textContent.trim();
        let vb = b.children[colIdx]?.dataset.sortVal ?? b.children[colIdx]?.textContent.trim();
        if (va === "") va = null;
        if (vb === "") vb = null;
        if (va == null && vb == null) return 0;
        if (va == null) return 1;
        if (vb == null) return -1;
        if (isNum) return asc ? parseFloat(va) - parseFloat(vb) : parseFloat(vb) - parseFloat(va);
        return asc ? va.localeCompare(vb) : vb.localeCompare(va);
      });
      rows.forEach(row => tbody.appendChild(row));
    });
  });
}

function render() {
  renderInfoBar();
  renderTable();
  setupSorting();
  document.getElementById("detail-toggle").addEventListener("click", () => {
    showDetails = !showDetails;
    render();
  });
}

renderIntro();
render();
</script>
</body>
</html>
